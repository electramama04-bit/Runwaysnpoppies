<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links — Runways &amp; Poppies</title>
<meta name="description" content="Museums, state resources, podcasts, and tools worth keeping for an aviation homeschool year.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="/">Runways &amp; <span>Poppies</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/downloads">Downloads</a>
      <a href="/links" aria-current="page">Links</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="hero">
    <h1>Links worth keeping</h1>
    <p>
      Places we actually went, laws we actually read, and things we actually
      listened to in the car.
    </p>
  </div>

  <section id="links">
    <p class="status">Loading&hellip;</p>
  </section>

</main>

<footer>
  <div class="wrap">
    <p>Runways &amp; Poppies &mdash; Tacoma, Washington.</p>
  </div>
</footer>

<script>
fetch("/api/links")
  .then((r) => r.json())
  .then(({ links }) => {
    const host = document.getElementById("links");
    if (!links.length) {
      host.innerHTML = '<p class="status">No links yet.</p>';
      return;
    }
    const groups = {};
    for (const link of links) (groups[link.category] ||= []).push(link);

    host.innerHTML = Object.entries(groups)
      .map(
        ([category, items]) => `
          <h2>${esc(category)}</h2>
          <ul class="linklist">
            ${items.map(itemHtml).join("")}
          </ul>`,
      )
      .join("");
  })
  .catch(() => {
    document.getElementById("links").innerHTML =
      '<p class="status">Could not load the links. Please refresh.</p>';
  });

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function itemHtml(link) {
  return `
    <li>
      <a href="${esc(link.url)}" rel="noopener noreferrer" target="_blank">${esc(link.title)}</a>
      <p>${esc(link.description)}</p>
    </li>`;
}
</script>

</body>
</html>
